name: Setup.exe bauen

# Startet automatisch, wenn du auf GitHub ein Release mit einem Tag wie "v0.1.0" veröffentlichst.
# Zum Ausprobieren kann der Workflow auch von Hand gestartet werden (Actions -> Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version und Repository-Name eintragen
        shell: pwsh
        run: |
          $v = "0.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          $c = Get-Content app/version.py -Raw
          $c = $c -replace '(?m)^VERSION = ".*"', "VERSION = `"$v`""
          $c = $c -replace '(?m)^GITHUB_REPO = ".*"', "GITHUB_REPO = `"$env:GITHUB_REPOSITORY`""
          Set-Content app/version.py $c -Encoding utf8
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content app/version.py

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: FFmpeg herunterladen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/ffmpeg | Out-Null
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile ffmpeg.zip; break } catch { Write-Host "Fehlgeschlagen: $u" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName vendor/ffmpeg/
          Copy-Item (Join-Path $exe.DirectoryName "ffprobe.exe") vendor/ffmpeg/
          & vendor/ffmpeg/ffmpeg.exe -version | Select-Object -First 1

      - name: Tests (Effekte, Export, Oberfläche)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $ErrorActionPreference = "Stop"
          # Jeder Test muss bestehen; bei einem Fehler bricht der Lauf sofort ab und nennt den Test.
          function T { python @args; if ($LASTEXITCODE -ne 0) { throw "TEST FEHLGESCHLAGEN: $args" } }
          T tests/test_effects_ffmpeg.py
          T tests/test_font.py
          T tests/test_grade.py
          T tests/test_audio.py $env:RUNNER_TEMP
          T tests/timeline_logic_check.py
          T tests/test_history.py
          T tests/test_release.py
          T tests/test_diagnostics.py
          T tests/test_preview.py $env:RUNNER_TEMP
          T tests/test_motion.py $env:RUNNER_TEMP
          T tests/test_subtitles.py $env:RUNNER_TEMP
          T tests/test_overlay.py $env:RUNNER_TEMP
          T tests/test_transitions.py $env:RUNNER_TEMP
          T tests/test_export.py $env:RUNNER_TEMP
          T tests/ui_smoke.py ui_smoke.png

      - name: Programm bauen (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name ClipForge `
            --icon "assets/icon.ico" `
            --add-data "presets;presets" `
            --add-data "assets;assets" `
            --add-data "THIRD_PARTY.txt;." `
            --add-data "fonts;fonts" `
            --add-data "vendor/ffmpeg;vendor/ffmpeg" `
            main.py

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" installer.iss
          Get-ChildItem installer_output

      - name: Setup.exe signieren (nur wenn ein Zertifikat hinterlegt ist)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /f sign.pfx /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 installer_output/ClipForge-Setup.exe
          Remove-Item sign.pfx

      - name: Setup.exe als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Setup
          path: |
            installer_output/ClipForge-Setup.exe
            ui_smoke.png

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/ClipForge-Setup.exe
          generate_release_notes: true
